name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Typecheck
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Commitlint
        if: github.event_name == 'pull_request'
        # `base.sha`, not `base_sha`: the latter is not a field, so it rendered empty and commitlint
        # walked the whole history instead of the PR, failing on release commits from years ago.
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Typecheck
        run: bun run ts

  package:
    runs-on: ubuntu-latest
    name: Package & Size
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `build` shells out to node-shebang bins (tsc, rimraf), so don't inherit the image's node.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The build only ever ran locally at release time, so packaging regressions surfaced at publish.
      # `build` ends with verify-dist.ts (declared paths, browser-safe graphs, size budgets).
      - name: Build and verify dist
        run: bun run build
      - name: Lint package manifest
        run: bunx publint --strict
        working-directory: packages/uql-orm
      # ESM-only by design, so node10 and require-from-CJS failures are expected.
      - name: Check type resolution
        run: bunx --bun @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm no-resolution
        working-directory: packages/uql-orm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Proves the tarball resolves and runs from a real node_modules, with no peers installed, on
      # every runtime the README claims. The assertions live in smoke.mjs and enumerate the entry
      # points from the manifest, so a new export is covered without editing this file, and a new
      # runtime is one more line here.
      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          tgz=$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -1)
          cp smoke.mjs "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund "./$tgz"
          node smoke.mjs
          deno run smoke.mjs
          bun smoke.mjs
        working-directory: packages/uql-orm

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
            version: latest
          - runtime: node
            version: lts/*
          - runtime: node
            version: latest
    name: Test (${{ matrix.runtime }} ${{ matrix.version }})
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.version }}
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libkrb5-dev
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start services
        run: docker compose up -d --wait
      - name: Run tests
        run: bun run test
      - name: Submit coverage
        if: matrix.runtime == 'node' && matrix.version == 'lts/*'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
