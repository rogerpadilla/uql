name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint & Typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run ts

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Package & Size
    steps:
      - uses: actions/checkout@v6
      # `build` shells out to node-shebang bins (tsc, rimraf), so don't inherit the image's node.
      - uses: ./.github/actions/setup
        with:
          node-version: lts/*
      # The build only ever ran locally at release time, so packaging regressions surfaced at publish.
      # `build` ends with verify-dist.ts (declared paths, browser-safe graphs, runtimes, size budgets).
      - name: Build and verify dist
        run: bun run build
      - name: Lint package manifest
        run: bunx publint --strict
        working-directory: packages/orm
      # ESM-only by design, so node10 and require-from-CJS failures are expected.
      - name: Check type resolution
        run: bunx --bun @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm no-resolution
        working-directory: packages/orm
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The axis is the suite, not a label: `test:bun` drives Bun's own drivers and never touches
          # node, so pairing it with each node version ran identical work three times. One suite per leg
          # also keeps two of them off these shared databases at once, as `bun run test` does by chaining.
          - suite: bun
            node: lts/*
          - suite: vitest
            node: lts/*
          - suite: vitest
            node: latest
    name: Test (${{ matrix.suite }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      # SQL Server sometimes crashes once as it boots; `restart: always` brings it back, but `--wait` has failed by then.
      - name: Start services
        run: docker compose up -d --wait || docker compose up -d --wait
      - name: Run tests
        run: bun run test:${{ matrix.suite }}
      # A hook that times out reports only `(unnamed)`, so a database that stalled or was silently
      # restarted (every service is `restart: always`) reads as a test bug. These logs say which it was,
      # and the images say whether a floating tag moved since the last green run.
      - name: Dump service state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose images
          docker compose logs --no-color --timestamps > compose.log
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-${{ strategy.job-index }}
          path: compose.log
      - name: Submit coverage
        if: matrix.suite == 'vitest' && matrix.node == 'lts/*'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
