services:
  mysql:
    image: mysql:26.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_USER: 'test'
      MYSQL_PASSWORD: 'test'
      MYSQL_DATABASE: 'test'
    ports:
      - 3316:3306
    container_name: uql-mysql-26
    # Binary logging is on by default, and with it MySQL refuses `CREATE TRIGGER` from a user without
    # SUPER unless trusted to - as a managed MySQL is by its parameter group. A flag, so a restart keeps it.
    command: ['--log-bin-trust-function-creators=1']
    healthcheck:
      # Over the socket, the temporary server the entrypoint runs while initializing answers too (it
      # listens on `port: 0`), so the container reported healthy with nothing on 3306 yet, `--wait`
      # returned, and docker-proxy closed each connection as mysql2's "Connection lost". It runs the init
      # script, as every engine's check here does: the image runs it only on an empty data directory.
      test:
        ['CMD-SHELL', 'mysql -h 127.0.0.1 --protocol=TCP -u root -proot < /docker-entrypoint-initdb.d/init-mysql.sql']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./docker/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql

  mariadb:
    image: mariadb:13.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_USER: 'test'
      MYSQL_PASSWORD: 'test'
      MYSQL_DATABASE: 'test'
    ports:
      - 3326:3306
    container_name: uql-mariadb-13
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'healthcheck.sh --connect --innodb_initialized && mariadb -u root -proot < /docker-entrypoint-initdb.d/init-maria.sql',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/init-maria.sql:/docker-entrypoint-initdb.d/init-maria.sql

  postgres:
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - 5442:5432
    container_name: uql-postgres-18
    healthcheck:
      # `-h`, so this waits for the real server rather than the socket-only one the entrypoint runs
      # while initializing, and runs the init script, as the mysql check above explains.
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD=test psql -h 127.0.0.1 -U test -d test -q -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/init-pg.sql',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./docker/init-pg.sql:/docker-entrypoint-initdb.d/init-pg.sql

  # Local stand-in for Neon's edge proxy: forwards a websocket connection to a plain
  # Postgres backend, so `@neondatabase/serverless` can be tested without a hosted Neon
  # project. ALLOW_ADDR_REGEX must match the `address` query param the client sends
  # (see neon/neonQuerier.test.ts's `wsProxy` config) - it defaults to `*.neon.tech:5432`.
  neon-wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    restart: always
    container_name: uql-neon-wsproxy
    environment:
      ALLOW_ADDR_REGEX: '^postgres:5432$'
    ports:
      # Offset host port (like postgres:5442) to avoid clashing with a common local :5433 (e.g. an
      # `ssh -L 5433:...` tunnel to another Postgres); the neon test connects to this same port.
      - 5443:80
    depends_on:
      postgres:
        condition: service_healthy

  # libSQL's server, what a Turso Cloud database runs unless created as `tursodb`. One per suite reaching
  # it over HTTP, `@libsql/client` and `@tursodatabase/serverless`, since both create the same tables. The
  # image has no HTTP client, so the check opens the port.
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    restart: always
    container_name: uql-libsql
    ports:
      - 8090:8080
    healthcheck: &libsql-healthcheck
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 5s
      timeout: 5s
      retries: 20

  turso:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    restart: always
    container_name: uql-turso
    ports:
      - 8091:8080
    healthcheck: *libsql-healthcheck

  cockroachdb:
    image: cockroachdb/cockroach:latest-v26.3
    restart: always
    container_name: uql-cockroachdb-26
    # `--cache` and `--max-sql-memory` default to a quarter of visible RAM *each*, so left alone this
    # claims up to ~8GB of a CI runner it shares with three other engines. It holds 20 tiny tables. The
    # store is in memory, as TypeORM, Drizzle and Knex run it for tests: no disk sync on every schema change.
    command: start-single-node --insecure --cache=256MiB --max-sql-memory=512MiB --store=type=mem,size=1GiB
    # Its settings live in that in-memory store, so a restart loses them, and the image reruns its init
    # scripts only on an empty data directory, which its own logs keep filled: applied in the check, healthy
    # implies configured. Unset, every dropped table's cleanup job waits hours and thousands pile up. A failure
    # inside `start_period` never counts, so few retries suffice at 60s apart.
    volumes:
      - ./docker/init-cockroach.sql:/init-cockroach.sql:ro
    ports:
      - 26257:26257
    healthcheck:
      test: ['CMD-SHELL', 'cockroach sql --insecure -f /init-cockroach.sql']
      interval: 60s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The one image here with no arm64 build, so it runs under emulation on Apple Silicon. 2025 needs
  # AVX, which Docker Desktop's Rosetta layer did not expose until the engine's CU1 stopped requiring
  # it; `2022-latest` never had that problem and passes the same suite unchanged, if this refuses to
  # start.
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    restart: always
    container_name: uql-mssql-2025
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'test!Test'
      MSSQL_PID: 'Developer'
    ports:
      - 1434:1433
    # The databases are created here because the image runs nothing from a volume on startup and has no
    # `docker-entrypoint-initdb.d`. A one-shot init container is not enough: `docker compose up --wait`
    # returns while such a container is still running, so CI would start testing before they existed.
    # Creating them in the check means healthy implies ready (`-b` fails it on an error), and the script
    # is idempotent.
    #
    # Snapshot isolation because SQL Server's default READ COMMITTED takes shared read locks where
    # every other engine here uses MVCC, so a concurrent ORM workload deadlocks on patterns that
    # deadlock nowhere else. It is the advice users need, and this way the suite runs on it.
    volumes:
      - ./docker/init-mssql.sql:/init-mssql.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init-mssql.sql',
        ]
      # Each check takes seconds under emulation, so it runs often only while the server starts.
      interval: 60s
      start_interval: 5s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Atlas Local: a one-node replica set, which transactions need, with the Atlas Search that
  # `$vectorSearch` and a `vectorSearch` index need, where a plain server answers `SearchNotEnabled`.
  mongodb:
    image: mongodb/mongodb-atlas-local:8
    restart: always
    container_name: uql-mongodb-8
    ports:
      - 27027:27017
    healthcheck:
      test: ['CMD', '/usr/local/bin/runner', 'healthcheck']
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 30s
