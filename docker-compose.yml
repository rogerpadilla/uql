services:
  mysql:
    image: mysql:26.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_USER: 'test'
      MYSQL_PASSWORD: 'test'
      MYSQL_DATABASE: 'test'
    ports:
      - 3316:3306
    container_name: uql-mysql-26
    healthcheck:
      # Over the socket, the temporary server the entrypoint runs while initializing answers too (it
      # listens on `port: 0`), so the container reported healthy with nothing on 3306 yet, `--wait`
      # returned, and docker-proxy closed each connection as mysql2's "Connection lost".
      test: ['CMD-SHELL', 'mysql -h 127.0.0.1 --protocol=TCP -u test -ptest -e "SELECT 1" test']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./docker/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql

  mariadb:
    image: mariadb:12.3
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_USER: 'test'
      MYSQL_PASSWORD: 'test'
      MYSQL_DATABASE: 'test'
    ports:
      - 3326:3306
    container_name: uql-mariadb-12
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/init-maria.sql:/docker-entrypoint-initdb.d/init-maria.sql

  postgres:
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - 5442:5432
    container_name: uql-postgres-18
    healthcheck:
      # `-h`, so this waits for the real server rather than the socket-only one the entrypoint runs
      # while initializing, as the mysql check above explains.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U test -d test']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./docker/init-pg.sql:/docker-entrypoint-initdb.d/init-pg.sql

  # Local stand-in for Neon's edge proxy: forwards a websocket connection to a plain
  # Postgres backend, so `@neondatabase/serverless` can be tested without a hosted Neon
  # project. ALLOW_ADDR_REGEX must match the `address` query param the client sends
  # (see neon/neonQuerier.test.ts's `wsProxy` config) - it defaults to `*.neon.tech:5432`.
  neon-wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    restart: always
    container_name: uql-neon-wsproxy
    environment:
      ALLOW_ADDR_REGEX: '^postgres:5432$'
    ports:
      # Offset host port (like postgres:5442) to avoid clashing with a common local :5433 (e.g. an
      # `ssh -L 5433:...` tunnel to another Postgres); the neon test connects to this same port.
      - 5443:80
    depends_on:
      postgres:
        condition: service_healthy

  cockroachdb:
    image: cockroachdb/cockroach:latest-v26.3
    restart: always
    container_name: uql-cockroachdb-26
    # `--cache` and `--max-sql-memory` default to a quarter of visible RAM *each*, so left alone this
    # claims up to ~8GB of a CI runner it shares with three other engines. It holds 20 tiny tables.
    command: start-single-node --insecure --cache=256MiB --max-sql-memory=512MiB
    ports:
      - '26257:26257'
    healthcheck:
      test: ['CMD-SHELL', "cockroach sql --insecure -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The one image here with no arm64 build, so it runs under emulation on Apple Silicon. 2025 needs
  # AVX, which Docker Desktop's Rosetta layer did not expose until the engine's CU1 stopped requiring
  # it; `2022-latest` never had that problem and passes the same suite unchanged, if this refuses to
  # start.
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    restart: always
    container_name: uql-mssql-2025
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'test!Test'
      MSSQL_PID: 'Developer'
    ports:
      - 1434:1433
    # The database is created here because the image runs nothing from a volume on startup and has no
    # `docker-entrypoint-initdb.d`. A one-shot init container is not enough: `docker compose up --wait`
    # returns while such a container is still running, so CI would start testing before the database
    # existed. Creating it in the check means healthy implies ready, and the statement is idempotent -
    # after the first pass it is `IF <false>` and a `SELECT 1`.
    #
    # Snapshot isolation because SQL Server's default READ COMMITTED takes shared read locks where
    # every other engine here uses MVCC, so a concurrent ORM workload deadlocks on patterns that
    # deadlock nowhere else. It is the advice users need, and this way the suite runs on it.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID(''test'') IS NULL BEGIN CREATE DATABASE test; ALTER DATABASE test SET READ_COMMITTED_SNAPSHOT ON; END SELECT 1"',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
